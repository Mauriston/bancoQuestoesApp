    <!-- Capturador de Erros de Diagnóstico -->
    <!-- Capturador Global de Erros e Promises -->
    <script>
      function mostrarErro(mensagem, arquivo) {
        var root = document.getElementById('root');
        if (root && root.innerHTML === '') {
          root.innerHTML = '<div style="padding: 20px; color: red; font-family: sans-serif;">' +
            '<h2>⚠️ Erro ao inicializar o React</h2>' +
            '<p><b>Detalhes:</b> ' + mensagem + '</p>' +
            '<p><b>Origem:</b> ' + arquivo + '</p>' +
            '</div>';
        }
      }
      
      // Documentação: capture=true é necessário para capturar erros de
      // carregamento de recursos (ex.: <script src> retornando 404), que
      // não se propagam e não seriam vistos por um listener na fase normal.
      window.addEventListener('error', function(e) {
        var mensagem = e.message || (e.target && e.target.src ? 'Falha ao carregar recurso: ' + e.target.src : 'Erro desconhecido');
        mostrarErro(mensagem, e.filename || (e.target && e.target.src) || 'Desconhecido');
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        mostrarErro(e.reason ? e.reason.message || e.reason : 'Erro Assíncrono Desconhecido', 'Falha em Promise/Firebase');
      });
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-teal-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
