name: Build e Deploy da Aplicacao

# O workflow será acionado quando houver um push na branch main
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Compilar e Preparar Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar o código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar o ambiente do Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: 3. Instalar as dependências do projeto
        run: bun install

      - name: 4. Executar a compilação (Build)
        run: bun run build
        env:
          # Injeta variáveis de ambiente necessárias para o build, se houver
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}

      - name: 5. Salvar a pasta de produção (Artefato)
        uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: dist/

