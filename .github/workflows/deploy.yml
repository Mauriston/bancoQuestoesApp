name: Build e Deploy no Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build_and_deploy:
    name: Compilar e Publicar no Firebase
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar o código do repositório
        uses: actions/checkout@v4

      # ATUALIZAÇÃO: Alterado de '20' para '24' para resolver o aviso de depreciação
      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 3. Configurar ambiente do Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: 4. Instalar as dependências do projeto
        run: bun install

      - name: 5. Compilar o Projeto (Frontend)
        run: bun run build

      - name: 6. Instalar Firebase CLI Globalmente
        run: npm install -g firebase-tools

      # O repositório não tem uma pasta functions/ (nenhuma Cloud Function
      # foi escrita ainda — ver auditoria dos fluxos Firebase), então
      # "--only functions,hosting" sempre falhava antes mesmo de tentar
      # publicar: o Firebase CLI recusa alvos que não existem no projeto.
      # Publicamos só o hosting (o frontend React estático) até existir
      # código de functions de verdade para publicar.
      - name: 7. Deploy no Firebase Hosting
        run: firebase deploy --only hosting --project gen-lang-client-0316191622
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
