name: Build e Deploy no Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build_and_deploy:
    name: Compilar e Publicar no Firebase
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar o código do repositório
        uses: actions/checkout@v4

      # ATUALIZAÇÃO: Alterado de '20' para '24' para resolver o aviso de depreciação
      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 3. Configurar ambiente do Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: 4. Instalar as dependências do projeto
        run: bun install

      - name: 5. Compilar o Projeto (Frontend)
        run: bun run build

      # Migrado de `firebase deploy` autenticado por FIREBASE_TOKEN (deprecado
      # pelo próprio Firebase e cujo token expirou) para a action oficial,
      # que autentica via Service Account (secret FIREBASE_SERVICE_ACCOUNT
      # com o conteúdo do JSON da chave) — sem depender de login interativo.
      - name: 6. Deploy no Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: gen-lang-client-0316191622
          channelId: live

      - name: 7. Instalar as dependências das Cloud Functions
        run: npm ci --prefix functions

      # Cloud Functions (geração do relatório de prova em PDF no servidor —
      # ver functions/README.md) exigem o plano Blaze (pay-as-you-go) no
      # projeto Firebase, e a Service Account acima precisa de permissões
      # além das que o deploy de Hosting já usa: Cloud Functions Admin,
      # Service Account User, Cloud Build Editor e Artifact Registry
      # Writer/Admin — concedidas manualmente no IAM do projeto GCP. Sem
      # isso, este passo falha com um erro claro apontando a API/permissão
      # que falta.
      #
      # --force: sem isso, o primeiro deploy de uma função nova numa região
      # ainda sem política de limpeza do Artifact Registry termina com
      # "Functions successfully deployed but could not set up cleanup
      # policy" e exit code 1 — a função É publicada normalmente, mas o
      # workflow fica marcado como falho à toa. --force já assume essa
      # política de limpeza automaticamente.
      - name: 8. Deploy das Cloud Functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          npx firebase-tools@latest deploy --only functions --project gen-lang-client-0316191622 --non-interactive --force
          rm -f "$RUNNER_TEMP/firebase-service-account.json"
